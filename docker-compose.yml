services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ksirovka
      POSTGRES_PASSWORD: ksirovka_dev
      POSTGRES_DB: ksirovka
    ports:
      - "3840:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ksirovka"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:8-alpine
    ports:
      - "3841:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
