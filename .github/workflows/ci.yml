name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  CI: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: žádný obraz neplave na :latest
        run: |
          if grep -nE '^\s*image:.*:latest' deploy/*.yml; then
            echo "✗ výše uvedené obrazy plavou — připni je na verzi@digest"
            exit 1
          fi
          echo "  ✓ žádný :latest"
      - name: závislosti
        run: npm ci --ignore-scripts
      - name: testy
        run: npm test
      - name: build
        run: npm run build

  build:
    timeout-minutes: 25
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: meta
        id: meta
        run: |
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/ksirovka:${{ steps.meta.outputs.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/ksirovka:main
          build-args: |
            APP_VERSION=0.1.0
            APP_COMMIT=${{ steps.meta.outputs.sha }}
            APP_BUILT_AT=${{ steps.meta.outputs.at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: balíček veřejný, ať VPS nemusí login
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            "/user/packages/container/ksirovka/visibility" \
            -f visibility=public
